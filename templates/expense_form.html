{% extends "base.html" %}

{% block title %}{{ mode }} expense — Spendly{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">{{ mode }} expense</h1>
            <p class="auth-subtitle">Keep track of your spending</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{% if mode == 'Edit' %}{{ url_for('edit_expense', id=expense.id) }}{% else %}{{ url_for('add_expense') }}{% endif %}">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" class="form-input" value="{{ expense.title if expense else '' }}" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" id="category" name="category" class="form-input" value="{{ expense.category if expense else '' }}" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount" step="0.01" min="0.01" class="form-input" value="{{ expense.amount if expense else '' }}" required>
                </div>
                <div class="form-group">
                    <label for="expense_date">Date</label>
                    <input type="date" id="expense_date" name="expense_date" class="form-input" value="{{ expense.expense_date if expense else '' }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" class="form-input" rows="4">{{ expense.description if expense else '' }}</textarea>
                </div>
                <button type="submit" class="btn-submit">Save expense</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
